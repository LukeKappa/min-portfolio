# Base Configuration for Zola with Duckquill
base_url = "/"
title = "Luke - Portfolio"
description = "Luke Esterhuizen - Computer Science Student portfolio showcasing projects, systems work, and technical skills."
theme = "duckquill"

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]
default_language = "en"
taxonomies = [{ name = "tags", feed = true }]

[markdown]
smart_punctuation = true
bottom_footnotes = true
github_alerts = true
lazy_async_image = true

[markdown.highlighting]
light_theme = "solarized-light"
dark_theme = "solarized-dark"
style = "class"
error_on_missing_language = false

[search]
index_format = "fuse_json"

[extra]
author_name = "Luke Esterhuizen"
author = "Luke Esterhuizen"
role = "Computer Science Student"
email = "lukekappa@duck.com"
github = "https://github.com/LukeKappa"
linkedin = "https://www.linkedin.com/in/lukekappa/"
cv_url = "https://github.com/LukeKappa/typst-cv/releases/latest/download/lukeEsterhuizenCV.pdf"

# Theme configuration
default_theme = "dark"
accent_color = "#27272a"
accent_color_dark = "#ededed"
# Feature toggles
show_copy_button = true
show_reading_time = true
show_share_button = true
show_backlinks = true

# Additional custom stylesheet
styles = ["custom.css"]
scripts = ["donut.js"]

# Source repository
source_url = "https://github.com/LukeKappa"

# Skills for the marquee
skills = [
    "C++",
    "Object Oriented Programming",
    "Data Structures & Algorithms",
    "Database Systems",
    "Advanced Networking",
    "Network Security",
    "Software Design",
    "Computer Architecture",
    "Digital Electronics",
    "Mathematics for Computing",
    "IT Project Management",
    "Linux Operating System",
    "Cloud Technologies",
    "Artificial Intelligence Ethics"
]

# Education entries
education = [
    { title = "BSc in Computer Science", meta = "Eduvos", url = "https://eduvosmarketing.powerappsportals.com/" },
    { title = "2nd Year Student", meta = "2025 – 2027" }
]

[extra.nav]
show_feed = false
show_theme_switcher = true
show_repo = true
links = [
    { url = "projects", name = "Projects" },
    { url = "blog", name = "Articles" },
    { url = "https://github.com/LukeKappa/typst-cv/releases/latest/download/lukeEsterhuizenCV.pdf", name = "CV" }
]

