{% extends "base.html" %}

{% block content %}
<main class="project-content">
    <a href="/" class="back-link">&larr; Back to Home</a>

    <header class="project-header">
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="subtitle">{{ page.description }}</p>
        {% endif %}
        {% if page.extra.links %}
        <div class="project-links">
            {% for link in page.extra.links %}
            <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.label }} &rarr;</a>
            {% endfor %}
        </div>
        {% endif %}
    </header>

    {{ page.content | safe }}
</main>
{% endblock content %}
